# Gera o app Android (TWA) do Pataí sem assinatura.
# A assinatura é feita fora do GitHub, com o keystore guardado pelo dono do app (nunca vai para o repositório).
name: Android (TWA)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Acordar o site (ícones e manifesto)
        run: for i in 1 2 3 4 5 6; do curl -sf https://conecta-local-6267.onrender.com/manifest.webmanifest && break; sleep 20; done
      - name: Gerar projeto e compilar
        working-directory: android
        run: |
          npm i -g @bubblewrap/cli@1.27.0
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          yes | bubblewrap build --skipSigning --manifest=./twa-manifest.json
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-android-sem-assinatura
          path: |
            android/app-release-bundle.aab
            android/app-release-unsigned-aligned.apk
