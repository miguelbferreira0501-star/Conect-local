# Compila o app do HamiCare para iPhone na nuvem (Mac do Codemagic) e manda para o TestFlight.
# Passo a passo (contas, chave da Apple e primeira compilação): hamicare/docs/LOJAS.md, parte "App Store".
workflows:
  hamicare-ios:
    name: HamiCare iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome da chave de API do App Store Connect cadastrada no Codemagic (Integrations → Developer Portal).
      app_store_connect: HamiCare ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hamicare.app
      node: 22
      xcode: latest
    scripts: &ios_scripts
      - name: Instalar e compilar o app web
        working_directory: hamicare/web
        script: |
          npm ci --include=dev
          npm run build
      - name: Copiar o app web para o projeto do iPhone
        working_directory: hamicare/web
        script: npx cap sync ios
      - name: Widget do Hami na tela do iPhone (só com HAMI_WIDGET=1)
        # Antes, no site da Apple: App Group group.com.hamicare.app ligado em com.hamicare.app e com.hamicare.app.widget
        # (passo a passo em hamicare/docs/LOJAS.md, parte "Widget"). Sem HAMI_WIDGET=1, o app sai sem widget, como antes.
        working_directory: hamicare/web/ios
        script: |
          if [ "$HAMI_WIDGET" = "1" ]; then
            ruby -e "require 'xcodeproj'" 2>/dev/null || gem install --user-install xcodeproj --no-document
            ruby scripts/add-widget.rb
          else
            echo "Widget desligado (HAMI_WIDGET diferente de 1)."
          fi
      - name: Certificados e perfis de assinatura
        script: xcode-project use-profiles
      - name: Número da versão (cada envio ao TestFlight precisa de um número maior)
        working_directory: hamicare/web/ios/App
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: Gerar o app assinado (.ipa)
        working_directory: hamicare/web/ios/App
        script: xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - hamicare/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Igual ao de cima, mas também manda para a REVISÃO da App Store. Roda sozinho quando você cria uma tag
  # "ios-v1.0.0" (ou pelo botão no Codemagic). Lançamento manual: depois de aprovado, você toca em "Publicar".
  hamicare-ios-loja:
    name: HamiCare iOS (enviar para a App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
    integrations:
      app_store_connect: HamiCare ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hamicare.app
      node: 22
      xcode: latest
    scripts: *ios_scripts
    artifacts:
      - hamicare/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: MANUAL

  # App Android (Capacitor) com o widget do Hami, assinado e enviado para a Google Play (teste interno).
  # Passo a passo (chave de assinatura e conta de serviço da Google): hamicare/docs/LOJAS.md, parte "Android com Capacitor".
  hamicare-android:
    name: HamiCare Android (Google Play)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        # Nome da chave (keystore) cadastrada no Codemagic (Team settings → Code signing identities → Android keystores).
        - hamicare_keystore
      groups:
        # Grupo com GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (conta de serviço da Google Play, em JSON).
        - google_play
      node: 22
      java: 21
    scripts:
      - name: Instalar e compilar o app web
        working_directory: hamicare/web
        script: |
          npm ci --include=dev
          npm run build
      - name: Copiar o app web para o projeto Android
        working_directory: hamicare/web
        script: npx cap sync android
      - name: Número da versão (cada envio para a Play precisa de um número maior)
        working_directory: hamicare/web/android
        script: |
          sed -i "s/versionCode [0-9]*/versionCode $((BUILD_NUMBER + 10))/" app/build.gradle
      - name: Gerar o app assinado (.aab)
        working_directory: hamicare/web/android
        script: ./gradlew bundleRelease
    artifacts:
      - hamicare/web/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

