# Publicação do HamiCare no Render (https://render.com) via "Blueprint".
# No Render: New → Blueprint → escolha o repositório e, em "Blueprint Path", escreva hamicare/render.yaml.
# Passo a passo completo em docs/PUBLICAR.md.
services:
  - type: web
    name: hamicare
    runtime: node
    plan: free
    rootDir: hamicare
    # --include=dev: o Render usa NODE_ENV=production, e sem isso o npm não instala as ferramentas de build.
    buildCommand: cd web && npm ci --include=dev && npm run build && cd ../server && npm ci
    # Na inicialização: cria o papel da API no banco e aplica as migrações.
    startCommand: cd server && npm run deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_DIST
        value: ../web/dist
      - key: DB_APP_PASSWORD
        generateValue: true
      - key: DATABASE_OWNER_URL
        sync: false
      # Seu e-mail (o mesmo da conta criada no app) para abrir o painel de administração:
      - key: ADMIN_EMAILS
        sync: false
      # Endereço público do app (ex.: https://hamicare.onrender.com), para a proteção contra CSRF:
      - key: APP_ORIGINS
        sync: false
      # E-mail de "Esqueci minha senha" sem domínio: Brevo (https://brevo.com). A chave começa com xkeysib-
      - key: BREVO_API_KEY
        sync: false
      # Remetente, com o e-mail verificado no Brevo. Ex.: HamiCare <seuemail@gmail.com>
      - key: MAIL_FROM
        sync: false
      # Com domínio próprio, troque pelo Resend em Environment: RESEND_API_KEY e APP_URL (veja docs/PUBLICAR.md).
      # App Android na Google Play (preencha depois de gerar o app; veja docs/LOJAS.md):
      # nome do pacote (ex.: com.hamicare.app) e as impressões SHA-256 das chaves, separadas por vírgula.
      - key: ANDROID_PACKAGE_NAME
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
      # Guardiões do Hami (dar HamiCare+ para quem não pode pagar): Mercado Pago (Pix e cartão).
      # Access token de produção e a assinatura secreta dos Webhooks (veja docs/LOJAS.md, parte "Guardiões").
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
