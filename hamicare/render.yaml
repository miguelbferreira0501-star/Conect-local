# Publicação do HamiCare no Render (https://render.com) via "Blueprint".
# No Render: New → Blueprint → escolha o repositório e, em "Blueprint Path", escreva hamicare/render.yaml.
# Passo a passo completo em docs/PUBLICAR.md.
services:
  - type: web
    name: hamicare
    runtime: node
    plan: free
    rootDir: hamicare
    buildCommand: cd web && npm ci && npm run build && cd ../server && npm ci
    # Na inicialização: cria o papel da API no banco e aplica as migrações.
    startCommand: cd server && npm run deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_DIST
        value: ../web/dist
      - key: DB_APP_PASSWORD
        generateValue: true
      - key: DATABASE_OWNER_URL
        sync: false
      # Seu e-mail (o mesmo da conta criada no app) para abrir o painel de administração:
      - key: ADMIN_EMAILS
        sync: false
      # Endereço público do app (ex.: https://hamicare.onrender.com), para a proteção contra CSRF:
      - key: APP_ORIGINS
        sync: false
      # E-mail de "Esqueci minha senha" (Resend). A chave começa com re_
      - key: RESEND_API_KEY
        sync: false
      # Remetente, com o domínio verificado no Resend. Ex.: HamiCare <nao-responda@hamicare.com.br>
      - key: MAIL_FROM
        sync: false
      # Só se tiver domínio próprio (ex.: https://hamicare.com.br). Em branco, usa o endereço do Render.
      - key: APP_URL
        sync: false
